<!doctype html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--ink:#f4f4f6;--muted:#9da0aa;--canvas:#0e0e10;--surface:#16161a;--raised:#1f1f24;--surface-ground:var(--canvas);--surface-elevated:var(--raised);--line:#35353d;--blue:#5E81AC;--orange:#bf6535;--red:#df635b;--paper:#f4f1ea;--radius:2px}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.55}.app{min-height:100vh;display:grid;grid-template-columns:216px minmax(0,1fr) 276px;grid-template-rows:auto 1fr}.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:15px 22px;border-bottom:1px solid var(--line);background:#121216}.brand{letter-spacing:-.03em;font-size:18px;font-weight:700}.brand i{display:inline-block;width:10px;height:10px;background:var(--orange);margin-right:8px}.sync{margin-left:auto;color:var(--muted);font-size:12px}.user{border-left:1px solid var(--line);padding-left:16px}.nav{padding:18px 14px;border-right:1px solid var(--line)}.nav button{width:100%;background:transparent;border:0;border-left:2px solid transparent;color:var(--muted);cursor:pointer;text-align:left;padding:11px 10px;font:inherit}.nav button.active,.nav button:hover{border-left-color:var(--blue);color:var(--ink);background:var(--raised)}.nav small{display:block;margin:24px 10px 8px;color:#6f7078;font-size:11px;letter-spacing:.1em}.main{padding:30px 34px 70px;min-width:0}.eyebrow{font-size:11px;color:var(--blue);letter-spacing:.12em;text-transform:uppercase}.headline{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:8px 0 30px}.headline h1{font-size:30px;line-height:1.15;letter-spacing:-.06em;margin:0}.headline p{max-width:430px;color:var(--muted);margin:0}.dockline{height:50px;position:relative;margin:0 0 30px;border-bottom:1px solid var(--line);overflow:hidden}.dockline:before,.dockline:after{content:"";position:absolute;left:-10%;width:78%;height:1px;background:#a6a7aa;transform-origin:right center}.dockline:before{top:12px;transform:rotate(4deg)}.dockline:after{bottom:12px;transform:rotate(-4deg)}.dockline .flow{position:absolute;bottom:23px;left:0;width:88%;height:2px;background:var(--blue)}.dockline .dock{position:absolute;right:9%;top:13px;width:26px;height:26px;background:var(--surface);border:2px solid #c0c1c3;border-radius:50%}.dockline .marker{position:absolute;right:3%;top:24px;width:18px;height:5px;background:var(--orange)}.section-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:9px;margin:34px 0 0}.section-head h2{font-size:15px;margin:0;letter-spacing:-.02em}.section-head span{color:var(--muted);font-size:12px}.list{margin:0;padding:0;list-style:none}.item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid #29292f}.item.done .task-title{text-decoration:line-through;color:var(--muted)}.check{appearance:none;width:17px;height:17px;border:1px solid #777982;background:transparent;cursor:pointer}.check:checked{background:var(--blue);border-color:var(--blue)}.task-title{display:block;font-weight:600}.task-meta{display:block;color:var(--muted);font-size:12px}.due{font-size:12px;color:var(--paper);white-space:nowrap}.due.today{color:var(--orange)}.due.overdue{color:var(--red)}.notice{padding:17px 0;border-bottom:1px solid #29292f}.notice-top{display:flex;gap:12px;justify-content:space-between}.notice h3{font-size:15px;margin:0}.notice p{color:var(--muted);margin:7px 0 10px}.notice-footer{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.notice-footer button,.text-button{background:transparent;border:1px solid #56565f;color:var(--ink);padding:5px 8px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px}.notice-footer button:hover,.text-button:hover{border-color:var(--blue);color:var(--blue)}.question-box{display:none;margin-top:12px}.question-box.open{display:flex;gap:8px}.question-box input{flex:1}.aside{border-left:1px solid var(--line);padding:20px 18px;background:#121216}.aside h2{font-size:13px;margin:0 0 12px}.metric{padding:14px 0;border-bottom:1px solid #29292f}.metric strong{display:block;font-size:28px;letter-spacing:-.07em}.metric span{color:var(--muted);font-size:12px}.schedule-item,.history-item{padding:12px 0;border-bottom:1px solid #29292f}.schedule-time{font-family:monospace;color:var(--blue);font-size:12px}.history-item{font-size:12px}.history-item time{color:var(--muted);display:block;margin-bottom:2px}.empty{padding:22px 0;color:var(--muted);text-align:center}.fab{position:fixed;right:22px;bottom:22px;background:var(--orange);color:#19120e;border:0;border-radius:6px;font-weight:700;padding:11px 14px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(14,14,16,.92);display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(480px,100%);background:var(--surface);border:1px solid var(--line);padding:24px}.dialog h2{margin:0 0 5px;font-size:20px}.dialog p{margin:0 0 20px;color:var(--muted)}label{display:block;margin:12px 0 4px;color:var(--muted);font-size:12px}input,textarea,select{width:100%;background:#101014;color:var(--ink);border:1px solid #4b4b54;padding:9px;font:inherit;border-radius:2px}textarea{min-height:86px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.primary{border:0;background:var(--blue);color:#07101b;border-radius:6px;padding:9px 12px;font-weight:700;cursor:pointer}.secondary{background:transparent;border:1px solid #56565f;color:var(--ink);border-radius:6px;padding:9px 12px;cursor:pointer}.toast{position:fixed;bottom:78px;right:22px;background:var(--paper);color:#242018;padding:10px 12px;display:none;max-width:300px}.toast.show{display:block}@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}.nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:4px}.nav button{white-space:nowrap;width:auto}.nav small{display:none}.main{padding:24px 20px}.aside{border-left:0;border-top:1px solid var(--line);padding:20px}.headline{display:block}.headline p{margin-top:12px}.dockline{margin-top:18px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><div class="brand"><i></i>팀 업무 보드</div><div class="sync" id="sync">시트 연결 중</div><div class="user" id="userName">사용자 선택</div></header>
    <nav class="nav"><small>흐름</small><button class="active" data-view="today">팀 실행</button><button data-view="personal">개인 신호</button><button data-view="promotions">공유 대기함</button><button data-view="history">히스토리</button><small>팀 관리</small><button data-view="notices">공지와 질문</button><button data-view="schedule">일정</button><button data-action="refresh">지금 갱신</button><button data-action="profile">내 정보</button></nav>
    <main class="main" id="main"></main>
    <aside class="aside" id="aside"></aside>
  </div>
  <button class="fab" id="newButton">+ 새 항목</button><div class="toast" id="toast"></div>
  <div class="modal" id="profileModal"><div class="dialog"><h2>누구로 기록할까요?</h2><p>이름은 업무 완료, 공지 확인, 질문 기록에 표시됩니다.</p><label for="profileName">이름</label><input id="profileName" autocomplete="name" placeholder="이름을 입력하세요"><label for="profileRole">역할</label><select id="profileRole"><option value="member">팀원</option><option value="lead">리드</option></select><div class="dialog-actions"><button class="primary" id="saveProfile">시작하기</button></div></div></div>
  <div class="modal" id="createModal"><div class="dialog" id="createDialog"></div></div>
  <script>
    const LOCAL_DATA_KEY='team-workboard-local-data-v1';
    const isAppsScript=()=>Boolean(window.google&&google.script&&google.script.run);
    const stamp=()=>new Date().toISOString();
    const today=()=>stamp().slice(0,10);
    const dayAfter=(days)=>{const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)};
    const localSeed=()=>({
      members:[{memberId:'m-local-lead',name:'나',email:'',role:'lead',active:'TRUE'}],
      tasks:[{taskId:'t-local-1',title:'첫 업무를 등록하세요',ownerId:'m-local-lead',dueDate:today(),status:'open',priority:'normal',driveUrl:'',updatedAt:stamp()}],
      notices:[{noticeId:'n-local-1',title:'로컬 모드로 실행 중',body:'이 파일에서 작성한 내용은 현재 브라우저의 localStorage에만 저장됩니다.',authorId:'m-local-lead',publishedAt:stamp(),audience:'all',driveUrl:''}],
      reads:[],questions:[],activity:[],schedule:[],promotions:[],syncLedger:[],settings:[]
    });
    function getLocalData(){try{return JSON.parse(localStorage.getItem(LOCAL_DATA_KEY))||localSeed()}catch(_){return localSeed()}}
    function saveLocalData(data){localStorage.setItem(LOCAL_DATA_KEY,JSON.stringify(data));return data}
    function localId(prefix){return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`}
    function localActivity(data,actorId,verb,targetType,targetId,message){data.activity.unshift({activityId:localId('a'),actorId:actorId||'system',verb,targetType,targetId,message,createdAt:stamp()})}
    function localCall(fn,...args){const data=getLocalData(), [payload,actorId]=args, done=value=>{saveLocalData(data);return value};
      if(fn==='getBootstrap')return {...data,serverTime:stamp(),refreshLabel:stamp()};
      if(fn==='saveMember'){if(!payload.name?.trim())throw Error('이름을 입력해 주세요.');const row={memberId:payload.memberId||localId('m'),name:payload.name.trim(),email:payload.email||'',role:payload.role||'member',active:'TRUE'};const i=data.members.findIndex(m=>m.memberId===row.memberId);i<0?data.members.push(row):data.members[i]=row;localActivity(data,row.memberId,'등록','member',row.memberId,`${row.name}님이 보드에 참여했습니다.`);return done(row)}
      if(fn==='saveTask'){if(!payload.title?.trim())throw Error('업무 제목을 입력해 주세요.');const row={taskId:payload.taskId||localId('t'),title:payload.title.trim(),ownerId:payload.ownerId||'',dueDate:payload.dueDate||'',status:payload.status||'open',priority:payload.priority||'normal',driveUrl:payload.driveUrl||'',updatedAt:stamp()};const i=data.tasks.findIndex(t=>t.taskId===row.taskId);i<0?data.tasks.push(row):data.tasks[i]=row;localActivity(data,actorId,payload.taskId?'수정':'등록','task',row.taskId,`업무: ${row.title}`);return done(row)}
      if(fn==='toggleTask'){const task=data.tasks.find(t=>t.taskId===payload);if(!task)throw Error('업무를 찾을 수 없습니다.');task.status=task.status==='done'?'open':'done';task.updatedAt=stamp();localActivity(data,actorId,task.status==='done'?'완료':'재개','task',task.taskId,`업무: ${task.title}`);return done(task)}
      if(fn==='saveAnnouncement'){if(!payload.title?.trim())throw Error('공지 제목을 입력해 주세요.');const row={noticeId:payload.noticeId||localId('n'),title:payload.title.trim(),body:(payload.body||'').trim(),authorId:actorId||'',publishedAt:stamp(),audience:payload.audience||'all',driveUrl:payload.driveUrl||''};data.notices.unshift(row);localActivity(data,actorId,'게시','announcement',row.noticeId,`공지: ${row.title}`);return done(row)}
      if(fn==='markAnnouncementRead'){const [noticeId,memberId]=args;let row=data.reads.find(r=>r.noticeId===noticeId&&r.memberId===memberId);if(!row){row={receiptId:localId('r'),noticeId,memberId,readAt:stamp()};data.reads.push(row);localActivity(data,memberId,'확인','announcement',noticeId,'공지를 확인했습니다.')}return done(row)}
      if(fn==='askQuestion'){if(!payload.body?.trim())throw Error('질문 내용을 입력해 주세요.');const row={questionId:localId('q'),noticeId:payload.noticeId||'',authorId:actorId||'',body:payload.body.trim(),createdAt:stamp(),resolvedAt:''};data.questions.unshift(row);localActivity(data,actorId,'질문','announcement',row.noticeId,row.body);return done(row)}
      if(fn==='saveSchedule'){if(!payload.title?.trim()||!payload.startAt)throw Error('제목과 시작 시각을 입력해 주세요.');const row={scheduleId:payload.scheduleId||localId('s'),title:payload.title.trim(),startAt:payload.startAt,endAt:payload.endAt||'',ownerId:payload.ownerId||'',driveUrl:payload.driveUrl||''};data.schedule.push(row);localActivity(data,actorId,'등록','schedule',row.scheduleId,`일정: ${row.title}`);return done(row)}
      if(fn==='savePromotion'){if(!payload.title?.trim())throw Error('공유할 제목을 입력해 주세요.');const row={promotionId:localId('p'),sourceType:payload.sourceType||'manual',sourceId:payload.sourceId||'',title:payload.title.trim(),summary:(payload.summary||'').trim(),proposedType:payload.proposedType||'task',payload:JSON.stringify(payload.payload||{}),status:'pending',actorId:actorId||'',createdAt:stamp(),sharedAt:'',sharedTargetId:''};data.promotions.unshift(row);localActivity(data,actorId,'공유 대기','promotion',row.promotionId,`공유 후보: ${row.title}`);return done(row)}
      throw Error(`로컬 모드에서는 ${fn} 기능을 사용할 수 없습니다.`)
    }
    const S={data:null,profile:JSON.parse(localStorage.getItem('team-board-profile')||'null'),view:'today'};
    const $=id=>document.getElementById(id); const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function call(fn,...args){if(!isAppsScript())return Promise.resolve().then(()=>localCall(fn,...args));return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));}
    function me(){return (S.data?.members||[]).find(m=>m.memberId===S.profile?.memberId)||S.profile;}
    function memberName(id){return (S.data?.members||[]).find(m=>m.memberId===id)?.name||'미지정';}
    function isoDate(v){return (v||'').slice(0,10)} function labelDate(v){if(!v)return '마감 없음';const today=new Date().toISOString().slice(0,10), d=Math.round((new Date(isoDate(v))-new Date(today))/86400000);return d===0?'오늘':d===1?'내일':d<0?`${Math.abs(d)}일 지남`:`D-${d}`}
    function personalSignals(){return S.personal?.signals||[]} function personalStatus(){return S.personal?.message||'개인 Work-board 연결을 확인하지 않았습니다.'}
    function normalizePersonalStatus(raw){const signals=[];const add=(sourceType,sourceId,title,summary,proposedType='task',payload={})=>{if(title)signals.push({sourceType,sourceId,title:String(title).slice(0,180),summary:String(summary||'').slice(0,400),proposedType,payload})};const issues=raw?.research?.latest?.work_issues||raw?.work_issues||[];issues.slice(0,6).forEach((x,i)=>add('research',x.id||`issue-${i}`,x.title||x.name,x.summary||x.description));const events=raw?.calendar?.events||raw?.events||[];events.slice(0,6).forEach((x,i)=>add('calendar',x.id||`event-${i}`,x.title||x.summary,'팀 일정으로 옮길지 확인이 필요합니다.','schedule',{startAt:x.startAt||x.start||'',endAt:x.endAt||x.end||''}));const projects=raw?.projects||raw?.git?.projects||[];projects.slice(0,4).forEach((x,i)=>add('project',x.id||`project-${i}`,x.name||x.title,'팀에서 처리할 항목인지 직접 선택하세요.'));return signals}
    async function refreshPersonal(){const endpoint='http://127.0.0.1:8765/api/status';try{const res=await fetch(endpoint,{cache:'no-store'});if(!res.ok)throw Error(`상태 코드 ${res.status}`);const raw=await res.json();S.personal={signals:normalizePersonalStatus(raw),message:'개인 Work-board 상태를 읽었습니다. 원문은 이 화면이나 시트에 저장하지 않습니다.'};}catch(_){S.personal={signals:[],message:'개인 Work-board가 실행 중이 아니거나 이 브라우저에서 연결할 수 없습니다. 팀 데이터에는 영향이 없습니다.'};}renderMain();renderAside()}
    async function load(silent=false){try{S.data=await call('getBootstrap');$('sync').textContent=isAppsScript()?`시트 기준 ${new Date(S.data.refreshLabel).toLocaleString('ko-KR')}`:'로컬 저장소 · 이 브라우저에서만 저장';if(!S.profile)$('profileModal').classList.add('open');render();if(!silent)toast(isAppsScript()?'공용 시트를 갱신했습니다.':'로컬 데이터를 갱신했습니다.')}catch(e){$('sync').textContent='데이터 연결을 확인하세요';toast(e.message||'데이터를 불러오지 못했습니다.');}}
    function render(){if(!S.data)return; $('userName').textContent=me()?.name||'사용자 선택';renderMain();renderAside();}
    function renderMain(){const tasks=S.data.tasks||[], notices=S.data.notices||[], questions=S.data.questions||[], schedule=S.data.schedule||[], activity=S.data.activity||[];
      if(S.view==='today'){$('main').innerHTML=`<div class="eyebrow">오늘의 흐름</div><div class="headline"><div><h1>먼저 확인하고,<br>그다음 움직입니다.</h1></div><p>마감, 미확인 공지, 질문을 한 흐름으로 보고 필요한 일만 처리합니다.</p></div><div class="dockline meaning-vector pivot"><svg viewBox="0 0 100 10" aria-hidden="true"><path d="M0 5H100" stroke="#5E81AC" stroke-width="4" fill="none"/></svg><div class="flow"></div><div class="dock"></div><div class="marker"></div></div><div class="section-head"><h2>오늘의 업무</h2><span>${tasks.filter(t=>t.status!=='done').length}건 남음</span></div><ul class="list">${taskList(tasks)}</ul><div class="section-head"><h2>확인이 필요한 공지</h2><span>읽음 기록이 시트에 남습니다</span></div>${noticeList(notices,questions)}`;}
      if(S.view==='notices'){$('main').innerHTML=`<div class="eyebrow">공지와 질문</div><div class="headline"><div><h1>알리고,<br>확인하고, 묻습니다.</h1></div><p>누가 확인했는지와 질문이 같은 공지 아래에 남습니다.</p></div>${noticeList(notices,questions)}`;}
      if(S.view==='schedule'){$('main').innerHTML=`<div class="eyebrow">일정</div><div class="headline"><div><h1>시간을 맞추고,<br>마감을 지킵니다.</h1></div><p>개인 캘린더를 수집하지 않습니다. 팀이 합의한 일정만 기록합니다.</p></div><div class="section-head"><h2>다가오는 일정</h2><span>${schedule.length}건</span></div>${scheduleList(schedule)}`;}
      if(S.view==='personal'){$('main').innerHTML=`<div class="eyebrow">개인 신호 · 비공개</div><div class="headline"><div><h1>개인 흐름에서,<br>공유할 일만 고릅니다.</h1></div><p>개인 Work-board의 상태를 읽되, 메일·메신저·앱 사용 기록 같은 원문은 이 화면과 팀 시트에 저장하지 않습니다.</p></div><div class="dockline meaning-vector pivot"><svg viewBox="0 0 100 10" aria-hidden="true"><path d="M0 5H100" stroke="#5E81AC" stroke-width="4" fill="none"/></svg><div class="flow"></div><div class="dock"></div><div class="marker"></div></div><div class="section-head"><h2>공유 후보</h2><button class="text-button" onclick="refreshPersonal()">개인 신호 갱신</button></div><p class="task-meta">${esc(personalStatus())}</p>${personalSignals().length?`<div class="list">${personalSignals().map((x,i)=>`<article class="notice"><div class="notice-top"><div><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p></div><button class="text-button" onclick="promoteSignal(${i})">공유 대기함에 넣기</button></div><div class="notice-footer"><span>${esc(x.proposedType==='schedule'?'팀 일정 후보':'팀 업무 후보')}</span></div></article>`).join('')}</div>`:'<div class="empty">개인 Work-board를 갱신하면, 공유 여부를 고를 수 있는 요약 신호만 보입니다.</div>'}`;}
      if(S.view==='promotions'){const items=S.data.promotions||[];$('main').innerHTML=`<div class="eyebrow">공유 대기함 · 검토 후 발행</div><div class="headline"><div><h1>고른 항목만,<br>팀의 약속으로 만듭니다.</h1></div><p>대기함은 개인과 팀 사이의 승인 경계입니다. 발행하면 그때 팀 업무·공지·일정과 이력에 남습니다.</p></div><div class="section-head"><h2>공유 대기 항목</h2><span>${items.filter(x=>x.status==='pending').length}건</span></div>${promotionList(items)}`;}
      if(S.view==='history'){$('main').innerHTML=`<div class="eyebrow">히스토리</div><div class="headline"><div><h1>기록은 남기고,<br>확인은 줄입니다.</h1></div><p>업무 상태, 공지 확인, 질문, 주기 갱신이 자동으로 기록됩니다.</p></div><div class="section-head"><h2>최근 활동</h2><span>시트 Activity 탭 기준</span></div>${historyList(activity)}`;}
      document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===S.view));
    }
    function taskList(tasks){if(!tasks.length)return '<div class="empty">등록한 업무가 없습니다.</div>';return tasks.sort((a,b)=>(a.status==='done')-(b.status==='done')).map(t=>`<li class="item ${t.status==='done'?'done':''}"><input class="check" type="checkbox" ${t.status==='done'?'checked':''} onchange="toggleTask('${t.taskId}')"><div><span class="task-title">${esc(t.title)}</span><span class="task-meta">담당 ${esc(memberName(t.ownerId))}${t.driveUrl?` · <a href="${esc(t.driveUrl)}" target="_blank">파일</a>`:''}</span></div><span class="due ${isoDate(t.dueDate)<new Date().toISOString().slice(0,10)?'overdue':isoDate(t.dueDate)===new Date().toISOString().slice(0,10)?'today':''}">${labelDate(t.dueDate)}</span></li>`).join('')}
    function noticeList(notices,questions){if(!notices.length)return '<div class="empty">등록한 공지가 없습니다.</div>';const reads=S.data.reads||[],active=(S.data.members||[]).filter(m=>m.active==='TRUE');return notices.sort((a,b)=>b.publishedAt.localeCompare(a.publishedAt)).map(n=>{const count=reads.filter(r=>r.noticeId===n.noticeId).length, qs=questions.filter(q=>q.noticeId===n.noticeId);return `<article class="notice"><div class="notice-top"><div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></div><button class="text-button" onclick="openQuestion('${n.noticeId}')">질문 ${qs.length}</button></div><div class="notice-footer"><span>확인 ${count}/${active.length}</span><button onclick="readNotice('${n.noticeId}')">확인했어요</button>${n.driveUrl?`<a href="${esc(n.driveUrl)}" target="_blank">첨부 열기</a>`:''}</div>${qs.length?`<div class="history-item">${qs.map(q=>`${esc(memberName(q.authorId))}: ${esc(q.body)}`).join('<br>')}</div>`:''}<div class="question-box" id="q-${n.noticeId}"><input placeholder="질문을 남기세요"><button class="primary" onclick="sendQuestion('${n.noticeId}')">남기기</button></div></article>`}).join('')}
    function scheduleList(items){if(!items.length)return '<div class="empty">등록한 일정이 없습니다.</div>';return `<div class="list">${items.sort((a,b)=>a.startAt.localeCompare(b.startAt)).map(i=>`<div class="schedule-item"><span class="schedule-time">${esc(String(i.startAt).replace('T',' · '))}</span><strong>${esc(i.title)}</strong><span class="task-meta">담당 ${esc(memberName(i.ownerId))}</span></div>`).join('')}</div>`}
    function historyList(items){if(!items.length)return '<div class="empty">아직 기록이 없습니다.</div>';return items.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,30).map(i=>`<div class="history-item"><time>${new Date(i.createdAt).toLocaleString('ko-KR')}</time><strong>${esc(memberName(i.actorId))}</strong> ${esc(i.verb)} · ${esc(i.message)}</div>`).join('')}
    function promotionList(items){if(!items.length)return '<div class="empty">아직 공유 대기 항목이 없습니다. 개인 신호에서 필요한 항목만 골라 넣으세요.</div>';return `<div class="list">${items.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(p=>`<article class="notice"><div class="notice-top"><div><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p></div>${p.status==='pending'?`<button class="text-button" onclick="publishPromotion('${p.promotionId}')">${isAppsScript()?'팀에 반영':'웹 앱에서 반영'}</button>`:'<span class="task-meta">팀 반영됨</span>'}</div><div class="notice-footer"><span>${esc(p.proposedType)} · ${new Date(p.createdAt).toLocaleString('ko-KR')}</span></div></article>`).join('')}</div>`}
    function renderAside(){const tasks=S.data.tasks||[],notices=S.data.notices||[],reads=S.data.reads||[],members=(S.data.members||[]).filter(m=>m.active==='TRUE'),today=new Date().toISOString().slice(0,10);const open=tasks.filter(t=>t.status!=='done'),due=open.filter(t=>isoDate(t.dueDate)===today),unread=notices.reduce((n,x)=>n+Math.max(0,members.length-reads.filter(r=>r.noticeId===x.noticeId).length),0),pending=(S.data.promotions||[]).filter(p=>p.status==='pending').length;$('aside').innerHTML=`<h2>오늘의 신호</h2><div class="metric"><strong>${open.length}</strong><span>남은 업무</span></div><div class="metric"><strong>${due.length}</strong><span>오늘 마감</span></div><div class="metric"><strong>${unread}</strong><span>공지 미확인</span></div><div class="metric"><strong>${pending}</strong><span>공유 대기</span></div><div class="section-head"><h2>다음 일정</h2></div>${scheduleList((S.data.schedule||[]).slice(0,3))}`}
    async function toggleTask(id){try{await call('toggleTask',id,me().memberId);await load(true)}catch(e){toast(e.message)}} async function readNotice(id){try{await call('markAnnouncementRead',id,me().memberId);await load(true)}catch(e){toast(e.message)}} function openQuestion(id){$(`q-${id}`).classList.toggle('open')}
    async function promoteSignal(index){const signal=personalSignals()[index];if(!signal)return;try{await call('savePromotion',{...signal,payload:signal.payload||{}},me().memberId);await load(true);S.view='promotions';renderMain();toast('공유 대기함에 넣었습니다. 팀 반영은 다음 단계에서 직접 선택합니다.')}catch(e){toast(e.message)}}
    async function publishPromotion(id){if(!isAppsScript()){toast('로컬 파일에서는 팀 시트에 발행하지 않습니다. Apps Script 웹 앱에서 열어 반영하세요.');return}try{await call('publishPromotion',id,me().memberId);await load(true);toast('선택한 항목을 팀 보드에 반영했습니다.')}catch(e){toast(e.message)}}
    async function sendQuestion(id){const box=$(`q-${id}`),body=box.querySelector('input').value;try{await call('askQuestion',{noticeId:id,body},me().memberId);await call('markAnnouncementRead',id,me().memberId);await load(true)}catch(e){toast(e.message)}}
    function openCreate(type='task'){const d=$('createDialog');d.innerHTML=type==='notice'?`<h2>공지 쓰기</h2><label>제목</label><input id="fTitle"><label>내용</label><textarea id="fBody"></textarea><div class="dialog-actions"><button class="secondary" onclick="closeCreate()">취소</button><button class="primary" onclick="saveNotice()">게시</button></div>`:type==='schedule'?`<h2>일정 등록</h2><label>제목</label><input id="fTitle"><label>시작</label><input id="fStart" type="datetime-local"><div class="dialog-actions"><button class="secondary" onclick="closeCreate()">취소</button><button class="primary" onclick="saveSchedule()">등록</button></div>`:`<h2>업무 등록</h2><label>업무 제목</label><input id="fTitle"><label>담당자</label><select id="fOwner">${(S.data.members||[]).filter(m=>m.active==='TRUE').map(m=>`<option value="${m.memberId}">${esc(m.name)}</option>`).join('')}</select><label>마감일</label><input id="fDue" type="date"><div class="dialog-actions"><button class="secondary" onclick="closeCreate()">취소</button><button class="primary" onclick="saveTask()">등록</button></div>`;$('createModal').classList.add('open')}
    function closeCreate(){$('createModal').classList.remove('open')} async function saveTask(){try{await call('saveTask',{title:$('fTitle').value,ownerId:$('fOwner').value,dueDate:$('fDue').value},me().memberId);closeCreate();await load(true)}catch(e){toast(e.message)}} async function saveNotice(){try{await call('saveAnnouncement',{title:$('fTitle').value,body:$('fBody').value},me().memberId);closeCreate();await load(true)}catch(e){toast(e.message)}} async function saveSchedule(){try{await call('saveSchedule',{title:$('fTitle').value,startAt:$('fStart').value,ownerId:me().memberId},me().memberId);closeCreate();await load(true)}catch(e){toast(e.message)}}
    async function saveProfile(){try{const row=await call('saveMember',{name:$('profileName').value,role:$('profileRole').value});S.profile=row;localStorage.setItem('team-board-profile',JSON.stringify(row));$('profileModal').classList.remove('open');await load(true)}catch(e){toast(e.message)}} function toast(message){const t=$('toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
    document.querySelectorAll('.nav button[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;renderMain()});document.querySelector('[data-action="refresh"]').onclick=()=>load();document.querySelector('[data-action="profile"]').onclick=()=>{$('profileName').value=me()?.name||'';$('profileModal').classList.add('open')};$('saveProfile').onclick=saveProfile;$('newButton').onclick=()=>openCreate(S.view==='notices'?'notice':S.view==='schedule'?'schedule':'task');load(true);setInterval(()=>load(true),30000);
  </script>
</body>
</html>
